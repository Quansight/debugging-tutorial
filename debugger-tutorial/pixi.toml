[workspace]
name = "numpy-watchpoint-tutorial"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]
requires-pixi = ">=0.81"

[dependencies]
c-compiler = "*"
cxx-compiler = "*"
ninja = "*"
pkg-config = "*"
git = "*"
uv = "0.12.9.*"

[tasks.setup-python]
description = "Prepare debug Python and the Python build dependencies"
cmd = "bash setup-python.sh"

# macOS uses Apple's LLDB, including its signed debugserver.
[target.linux-64.dependencies]
lldb = "22.1.*"

[target.linux-aarch64.dependencies]
lldb = "22.1.*"
