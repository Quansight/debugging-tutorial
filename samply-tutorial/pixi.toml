[workspace]
name = "debugging-tutorials"
channels = ["conda-forge", "conda-forge/label/python_rc"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]
requires-pixi = ">=0.81"
preview = ["pixi-build"]

[dependencies]
python = "3.15.*"
python-freethreading = "*"
c-compiler = "*"
cxx-compiler = "*"
ninja = "*"
pkg-config = "*"
git = "*"
samply = "*"

[pypi-dependencies]
scikit-learn = "==1.9.1"
pandas = ">=3.0.6, <4"

[activation.env]
# Work around lack of oversaturation protection in current versions of joblib:
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"